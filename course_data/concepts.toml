[[concept]]
id = "hypothesis-testing-steps"
title = "The three steps of hypothesis testing"
topic = "inference"
status = "core"
related = ["null-hypothesis", "significance", "p-value"]
asked_as = [
  "what are the steps for hypothesis testing",
  "explain the hypothesis testing framework",
  "how does hypothesis testing work",
]
body = '''
There are three steps for Hypothesis testing:
1. Develop the hypothesis Ho and Ha
2. Collect Evidence: We collect and analyze data to obtain the right measure of significance
3. Make conclusion: Compare significance to 5% to reject the Ho
'''

[[concept]]
id = "null-hypothesis"
title = "Developing the null hypothesis"
topic = "inference"
status = "core"
related = ["hypothesis-testing-steps", "significance"]
asked_as = [
  "how do I develop the null hypothesis",
  "what do I write for the null and alternative hypothesis",
  "what is the null hypothesis in this context",
]
body = '''
Null hypothesis is what we expect things to happen when there is no difference, no effect, no change… The key here is to translate the concept of "nothing" in given context.

Ex: in the context of marketing promotion, "nothing" means the promotion has no impact (on the revenue).
'''

[[concept]]
id = "significance"
title = "Understanding significance"
topic = "inference"
status = "core"
related = ["p-value", "null-hypothesis", "hypothesis-testing-steps"]
asked_as = [
  "what does significance mean",
  "what is the interpretation of a significance value less than 5%",
  "what does Significance F mean",
  "what is the interpretation sentence for significance in regression",
  "what does statistically significant mean",
]
body = '''
Significance describes how likely a sample can be observed given the null hypothesis of the population. The smaller is the significance, the more unlikely to observe our sample, which means the sample is more significantly indicating the true population is different from the expectation based on the null hypothesis.
'''

[[concept]]
