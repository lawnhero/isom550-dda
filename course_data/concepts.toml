# Tier B: the concepts this course teaches.
#
# Replaces data/isom550/isom550_contents.csv, a two-column Question/Response
# sheet that lived outside the repo. What that shape could not express is why
# this file exists:
#
#   - WHICH CLASS a concept belongs to, so coverage can be checked against the
#     syllabus instead of assumed. The CSV had nothing for Classes 6-10 -- half
#     the course -- and nothing anywhere said so.
#   - HOW STUDENTS ACTUALLY ASK, so retrieval matches their words and not the
#     instructor's. `asked_as` is mined from the real query log, not invented;
#     see scripts/mine_concept_aliases.py.
#   - WHICH CONCEPTS TRAVEL TOGETHER. Collinearity is two concepts that are
#     useless apart, and the four inference concepts are one chain.
#
# Edit this file, then rebuild:
#
#     python scripts/build_concepts.py --dry-run     # report, embed nothing
#     python scripts/build_concepts.py               # write the index
#
# FIELDS
#   id         stable slug. Retrieval groups by it, so changing one splits a
#              concept in two until the next rebuild.
#   title      what the student sees in the sources expander.
#   topic      must be one of the topics in [taxonomy] below.
#   status     "core" (counts toward coverage) or "extension" (does not).
#   asked_as   student phrasings, each embedded as its own vector. Questions
#              only -- not statements, not "how do I do X in JMP" (that is the
#              software route's job, and it does not retrieve).
#   related    other concept ids to read alongside this one.
#   body       the answer, verbatim from the instructor apart from spelling.

schema_version = 1

# --------------------------------------------------------------------------
# Topic vocabulary, one entry per class session. `class` matches the Tier C
# recap titles so the two indexes can be joined on it, and so the coverage
# check can name the class that has nothing.
# --------------------------------------------------------------------------
[taxonomy]
data-basics             = { class = "Class 1 (6/29)", label = "Data types and scales" }
describing-one-variable = { class = "Class 1 (6/29)", label = "Describing one variable" }
describing-two-variables = { class = "Class 2 (7/1)", label = "Describing two variables" }
simple-regression       = { class = "Class 3 (7/6)",  label = "Simple linear regression" }
multiple-regression     = { class = "Class 4 (7/09)", label = "Multiple regression" }
inference               = { class = "Class 3 (7/6)",  label = "Hypothesis testing and significance" }
model-building          = { class = "Class 5 (7/13)", label = "Model building and collinearity" }
logistic-regression     = { class = "Class 6 (7/16)", label = "Residuals and logistic regression" }
decision-basics         = { class = "Class 7 (7/20)", label = "Decision basics" }
decision-analysis       = { class = "Class 8 (7/23)", label = "Decision analysis in Excel" }
sensitivity-analysis    = { class = "Class 9 (7/27)", label = "Sensitivity analysis" }
value-of-information    = { class = "Class 10 (7/30)", label = "Value of information" }


# ==========================================================================
# Class 1 — data scales, describing one variable
# ==========================================================================

[[concept]]
id = "data-scales"
title = "The four types of data scale"
topic = "data-basics"
status = "core"
related = ["describe-quantitative-variable"]
asked_as = [
  "please define nominal, ordinal, interval, and ratio",
  "how to understand data scales",
  "what's a data scale",
  "difference between nominal and ordinal variables",
  "can you define the different types of variables and how to categorise them",
  "what are the four data types",
]
body = '''
- Nominal data are categories with no ranking. You can count frequencies and find the most common category, but can't calculate averages or measure distances between categories.
- Ordinal data have ranked categories but unequal gaps. You can identify the median and compare relative positions, but the differences between values are not universally defined and comparable.
- Interval data have equal spacing but no true "absolute" zero - temperature scales or survey scores using standardized scales. The difference between any two values are measurable and comparable.
- Ratio data have equal spacing and a true "absolute" zero point. This zero indicates None of what's measured by the variable.
'''

[[concept]]
id = "describe-quantitative-variable"
title = "Describing a quantitative variable numerically"
topic = "describing-one-variable"
status = "core"
related = ["mean-interpretation", "standard-deviation", "z-value", "skewness"]
asked_as = [
  "how do I describe a variable",
  "how to conduct a descriptive analysis on a single quantitative variable",
  "how do we analyze individual variables in more detail",
  "what are the managerial keywords for describing the center, spread and outliers",
  "what are the three perspectives for describing data",
]
body = '''
We typically focus on three different perspectives, the center, the spread and the outliers.
'''

[[concept]]
id = "mean-interpretation"
title = "Interpreting the mean of one variable"
topic = "describing-one-variable"
status = "core"
related = ["median-interpretation", "central-tendency-choice"]
asked_as = [
  "how to interpret mean",
  "what does the mean tell me",
  "what are the correct keywords and context for describing the mean in a memo",
  "how do I interpret the average",
]
body = '''
The mean can be interpreted as the "typical" value in a given context (context involves what is the variable and unit of measure).
'''

[[concept]]
id = "median-interpretation"
title = "Interpreting the median of a variable"
topic = "describing-one-variable"
status = "core"
related = ["mean-interpretation", "central-tendency-choice", "skewness"]
asked_as = [
  "how do I interpret the median",
  "how do I know which one is the mean and which is the median",
  "what is the difference between the mean and the median",
  "when should I use the median instead of the average",
]
body = '''
The median represents the middle value when your data is arranged from lowest to highest - it's the point where 50% of observations fall below and 50% fall above.

The median reveals the "typical" experience of your customers, employees, or business units. Unlike the average, it isn't skewed by extreme outliers, making it particularly valuable for real-world business conditions where data might be heavily skewed.
'''

[[concept]]
id = "central-tendency-choice"
title = "Choosing the best measure of central tendency"
topic = "describing-one-variable"
status = "core"
related = ["mean-interpretation", "median-interpretation", "skewness"]
asked_as = [
  "how do you describe central tendency",
  "what is the best measure of central tendency",
  "should I use the mean or the median",
  "when do I use the mode",
]
body = '''
The "best" measure of central tendency depends on your business context and data characteristics.
- Use the median when dealing with skewed data like salaries, customer spending, or deal sizes where outliers would distort the picture. It shows what most of your business actually experiences.
- Use the mean (average) when you need to understand total impact or when data is normally distributed. It's essential for financial planning, resource allocation, and forecasting since it accounts for every data point.
- Use the mode when identifying the most common category or value, such as the most popular product feature, frequent customer complaint, or typical order size.
'''

[[concept]]
id = "standard-deviation"
title = "Interpreting standard deviation"
topic = "describing-one-variable"
status = "core"
related = ["z-value", "describe-quantitative-variable"]
asked_as = [
  "what is standard deviation",
  "remind me how standard deviation works",
  "keywords for standard deviation in managerial terms",
  "how do I interpret the standard deviation of a data set",
  "how far from the mean is one standard deviation",
]
body = '''
Technically: standard means Average, and deviation means the difference between actual data and the typical value (the mean).

Insights: based on empirical rule, about 2/3 or 68% of the observations are within one stdev around the mean. This indicates the most typical range of values.
'''

[[concept]]
id = "z-value"
title = "Using a z-value to judge how extreme a data point is"
topic = "describing-one-variable"
status = "core"
related = ["standard-deviation", "skewness"]
asked_as = [
  "how would you interpret a z score of 1.76",
  "what if the z score is 1, 2 or 3",
  "which z scores are common, uncommon or rare",
  "what is the z score formula",
  "how do I tell if a value is an outlier",
]
body = '''
Z-value measures how many standard deviations a data point is away from the mean. It standardizes different variables onto the same scale for comparison.

Insights: Z-values help identify outliers and benchmark performance across different metrics.
- |z| > 3 means the data is very unlikely or uncommon
- 2 < |z| < 3 means the data is unlikely or uncommon
- 1 < |z| < 2 means the data is likely or common
- |z| < 1 means the data is very common.
'''

[[concept]]
id = "skewness"
title = "Interpreting skewness"
topic = "describing-one-variable"
status = "core"
related = ["histogram", "median-interpretation", "central-tendency-choice"]
asked_as = [
  "what does a skewness of 1.25 mean",
  "explain the difference between right skewness and left skewness",
  "how do I interpret the shape and skew of a distribution",
  "what does right skewed mean",
]
body = '''
Technically: Skewness measures the asymmetry of data distribution - whether values cluster more toward one end of the range, creating a "tail" on the opposite side. Understanding skewness helps choose appropriate benchmarks and realistic targets, since heavily skewed data makes the mean misleading for typical performance expectations.

Business Insights: When interpreting, we focus on two perspectives,
- where most data are centered on
- there are "more than expected" (not most) of observations in the skewed side of data.
'''

[[concept]]
id = "histogram"
title = "Using a histogram to visualise one variable"
topic = "describing-one-variable"
status = "core"
related = ["skewness", "standard-deviation"]
asked_as = [
  "explain histograms to me",
  "what does it mean when the observed shape differs from the bell curve",
  "what is the purpose of a bin in a histogram",
  "how do I read a histogram",
]
body = '''
We use histogram to visualize one quantitative variable. Specifically, histogram can be compared to normal curve based on empirical rule to identify possible issues in data. If the histogram is skewed, we interpret the skewness by emphasizing the tail with "more than expected ...".
'''

[[concept]]
id = "pareto-chart"
title = "Interpreting a Pareto bar chart"
topic = "describing-one-variable"
status = "core"
asked_as = [
  "how do I interpret a Pareto bar chart",
  "is a pareto chart useful for two variables",
  "does pareto apply when the percentages are close together",
  "does pareto make sense for categorical values",
]
body = '''
A Pareto chart reveals which factors drive the majority of your business problems or outcomes, helping you prioritize where to focus limited resources for maximum impact. Typically, a small number of categories (around 20%) account for the large majority (around 80%) of the total effect.

Note: given the nominal variable, the 80/20 insight may only partially apply or not at all apply.
'''


