# Tier A — hand-maintained course facts
#
# This file is written by a HUMAN and only ever read by the app.
# The sync script never touches it. (Canvas-derived data lives in schedule.json.)
#
# RULE: if Canvas already owns a fact, do NOT restate it here.
#   - due dates, assignment names, module list  -> schedule.json (synced)
#   - office hours, grading weights, policies   -> this file (hand-maintained)
# Duplicating a fact across both files recreates the drift problem.
#
# Review every field at the start of each term and bump `last_reviewed`.

term          = "Fall 2026"
last_reviewed = "2026-08-21"

# How many days schedule.json may go un-synced before the tutor stops stating
# specific due dates and tells students to check Canvas instead.
#
# Set this from the longest expected gap between syncs, not from class cadence.
# At 2 classes/week the normal gap is 3-4 days either way; what stretches it is
# term breaks. Observed max gap in Summer 2026: 4 days.
#   Summer (no breaks)                    ->  7
#   Fall/Spring (fall break, Thanksgiving,
#                spring break: 9-11 days) -> 12-14
# Too tight is not free: a false trip silences every date answer for a week,
# exactly when students are catching up after a break.
stale_after_days = 12


