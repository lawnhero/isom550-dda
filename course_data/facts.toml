# Structured separately from [materials] because the software route needs the
# version assumption to answer JMP/Excel questions without guessing menu paths.
[software]
excel     = "Microsoft Excel 2016 or later"
jmp       = "JMP 18 Student recommended; other versions may work"
addins    = "TreePlan Excel add-in, for decision tree modeling"

# The software route answers JMP/Excel questions from the model's own knowledge
# rather than from retrieval -- it knows these tools well. 
conventions = """
- Regression is done in JMP via Analyze > Fit Model (Standard Least Squares, Minimum Report). Excel's Data Analysis ToolPak is also discussed.
- Correlation applied to only Quantitative variables as well as binary variables only. 
- Categorical predictors: interpret coefficients using indicator (dummy) coding for both Excel and JMP. In JMP, read them from red triangle > Estimates > Indicator Parameterization Estimates, not the default Parameter Estimates.
- Logistic regression in JMP models the probability of Y=1. Set the outcome of interest as the target level (red triangle > Target Level) before interpreting signs or odds ratios.
- Report RSquare for both simple and multiple regression regression.
- Significance is judged at 0.05, two-tailed, using Prob > |t|.
- Model reduction is done by hand: remove the single insignificant variable with the highest p-value, re-run, repeat. For JMP, use the specification in Effect Summary.
- Decision trees are built with the TreePlan add-in in Excel only. Terminal node values are net cash flows; roll back with expected values.
- Sensitivity analysis uses Excel Data > What-If Analysis (Goal Seek, one- and two-variable Data Tables)
"""


[objectives]
body = """
By the end of this course, you will be able to:

- Explain the role of data and models in the decision-making process, and how
  they support rather than determine decisions.
- Decide how to structure a business problem and determine the data needs.
- Explain the difficulties of collecting data, and why effective decision making
  depends on data quality.
- Decide what analytical tools are appropriate in different business contexts.
- Evaluate the quality of models created with statistical tools.
- Translate analytical results into a statement of the actions to be taken.
- Gain exposure to various implementation environments, including Excel, SAS
  JMP, Python, and SQL.
"""


