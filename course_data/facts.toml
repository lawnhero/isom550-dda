[materials]
body = """
**Textbook (strongly recommended)**
*Practical Data Analysis with JMP*, Carver, 3rd Edition. Covers typical data
analysis topics; not all chapters are covered in class, but it is a useful
reference during and after the course. The book uses JMP, though Excel is also
used. Available at the SAS Bookstore: https://support.sas.com/en/books.html

**Canvas course site**
Most course materials are posted on Canvas: readings, project descriptions,
practice problems, and videos.

**Required case studies**
Three HBP cases available for purchase via Study.net. Additional cases are
posted on Canvas.
"""


# Structured separately from [materials] because the software route needs the
# version assumption to answer JMP/Excel questions without guessing menu paths.
[software]
excel     = "Microsoft Excel 2016 or later"
jmp       = "JMP 18 Student recommended; other versions may work"
addins    = "TreePlan Excel add-in, for decision tree modeling"

# The software route answers JMP/Excel questions from the model's own knowledge
# rather than from retrieval -- it knows these tools well. What it CANNOT know is
# where this course diverges from tool defaults, which is what this field is for.
# These are the highest-value lines in this file: a student reading their own
# output wrong because Excel and JMP disagree is a real, recurring failure.
#
# Your Class 5 (7/13) announcement already states one:
#   "Excel and JMP use different baseline group ... Excel uses a particular
#    category such as Cape Cod as baseline, while JMP uses the average of all
#    categories as the baseline."
#
# Add that and any others as short bullet lines. Left empty rather than
# transcribed for you, since deciding which conventions matter is a teaching
# call, not a formatting one.
conventions = ""


[objectives]
body = """
By the end of this course, you will be able to:

- Explain the role of data and models in the decision-making process, and how
  they support rather than determine decisions.
- Decide how to structure a business problem and determine the data needs.
- Explain the difficulties of collecting data, and why effective decision making
  depends on data quality.
- Decide what analytical tools are appropriate in different business contexts.
- Evaluate the quality of models created with statistical tools.
- Translate analytical results into a statement of the actions to be taken.
- Gain exposure to various implementation environments, including Excel, SAS
  JMP, Python, and SQL.
"""


